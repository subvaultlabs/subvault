<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="t d">
  <title id="t">SubVault returns 6 times more answer per token than Claude past chats</title>
  <desc id="d">Side by side benchmark on the same query in the same Claude.ai session. SubVault returned 47 structured items in 2,082 tokens. Claude past-chats surfaced 4 chat snippets totaling roughly 5,400 tokens.</desc>

  <defs>
    <style>
      /* --- Colors (auto-switched by prefers-color-scheme below) --------- */
      .bg     { fill: #F0EFF5; }
      .ink    { fill: #0D0C12; }
      .ink2   { fill: #38354A; }
      .ink3   { fill: #8B88A0; }
      .cobalt { fill: #2060E8; }
      .red    { fill: #D43030; }
      .divider           { stroke: #0D0C12; stroke-opacity: 0.08; stroke-width: 1; }
      .bar-claude        { fill: #D43030; opacity: 0.18; }
      .bar-claude-stroke { fill: none; stroke: #D43030; stroke-width: 1.5; }
      .bar-sv            { fill: #2060E8; opacity: 0.14; }
      .bar-sv-stroke     { fill: none; stroke: #2060E8; stroke-width: 1.5; }

      /* --- Typography --------------------------------------------------- */
      .label     { font-family: 'IBM Plex Mono', 'SF Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; fill: #8B88A0; }
      .hero      { font-family: 'IBM Plex Mono', 'SF Mono', monospace; font-size: 56px; font-weight: 600; letter-spacing: -2px; }
      .sub       { font-family: 'DM Sans', 'Inter', sans-serif; font-size: 20px; font-weight: 500; letter-spacing: -0.4px; }
      .body      { font-family: 'DM Sans', 'Inter', sans-serif; font-size: 13px; }
      .body-i    { font-family: 'DM Sans', 'Inter', sans-serif; font-size: 14px; font-style: italic; }
      .row-label { font-family: 'DM Sans', 'Inter', sans-serif; font-size: 13px; font-weight: 500; }
      .row-num   { font-family: 'IBM Plex Mono', 'SF Mono', monospace; font-size: 13px; font-weight: 600; }
      .row-aside { font-family: 'DM Sans', 'Inter', sans-serif; font-size: 11px; }
      .stat-text { font-family: 'DM Sans', 'Inter', sans-serif; font-size: 13px; }
      .stat-num  { font-family: 'IBM Plex Mono', 'SF Mono', monospace; font-weight: 600; }

      /* --- Dark mode --------------------------------------------------- */
      @media (prefers-color-scheme: dark) {
        .bg      { fill: #0D0C12; }
        .ink     { fill: #F0EFF5; }
        .ink2    { fill: #C4C1D4; }
        .ink3    { fill: #8B88A0; }
        .cobalt  { fill: #5B8DEF; }
        .red     { fill: #F07070; }
        .divider { stroke: #F0EFF5; stroke-opacity: 0.10; }
        .bar-claude        { fill: #F07070; opacity: 0.22; }
        .bar-claude-stroke { stroke: #F07070; }
        .bar-sv            { fill: #5B8DEF; opacity: 0.20; }
        .bar-sv-stroke     { stroke: #5B8DEF; }
      }
    </style>
  </defs>

  <rect class="bg" width="960" height="380"/>

  <!-- LEFT COLUMN: hero number + query -->
  <text x="48" y="56"  class="label">BENCHMARK · 2026-04-29</text>
  <text x="48" y="120" class="ink hero">6×</text>
  <text x="48" y="158" class="ink2 sub">more answer per token</text>
  <text x="48" y="184" class="ink3 body">Same query. Same Claude.ai session. Verifiable.</text>

  <line x1="48" y1="218" x2="340" y2="218" class="divider"/>

  <text x="48" y="248" class="label">THE QUERY</text>
  <text x="48" y="276" class="ink2 body-i">"What did we do on March 18 2026?"</text>

  <!-- RIGHT COLUMN: bars + numbers, stacked vertically -->

  <!-- Tokens consumed -->
  <text x="420" y="56" class="label">TOKENS CONSUMED</text>

  <g transform="translate(420, 78)">
    <text x="0"   y="0" class="ink row-label">Claude past chats</text>
    <text x="492" y="0" text-anchor="end" class="red row-num">~5,400</text>
    <rect x="0" y="10" width="492" height="14" rx="3" class="bar-claude"/>
    <rect x="0" y="10" width="492" height="14" rx="3" class="bar-claude-stroke"/>
  </g>

  <g transform="translate(420, 124)">
    <text x="0"   y="0" class="ink row-label">SubVault remember</text>
    <text x="190" y="0" text-anchor="end" class="cobalt row-num">2,082</text>
    <rect x="0" y="10" width="190" height="14" rx="3" class="bar-sv"/>
    <rect x="0" y="10" width="190" height="14" rx="3" class="bar-sv-stroke"/>
  </g>

  <line x1="420" y1="172" x2="912" y2="172" class="divider"/>

  <!-- Items returned -->
  <text x="420" y="200" class="label">ITEMS RETURNED</text>

  <g transform="translate(420, 224)">
    <text x="0"   y="0" class="ink row-label">Claude past chats</text>
    <text x="280" y="0" text-anchor="end" class="red row-num">4</text>
    <text x="294" y="0" class="ink3 row-aside">chat snippets, partial coverage</text>
  </g>

  <g transform="translate(420, 252)">
    <text x="0"   y="0" class="ink row-label">SubVault remember</text>
    <text x="280" y="0" text-anchor="end" class="cobalt row-num">47</text>
    <text x="294" y="0" class="ink3 row-aside">structured items, dated, comprehensive</text>
  </g>

  <line x1="420" y1="284" x2="912" y2="284" class="divider"/>

  <!-- Latency -->
  <text x="420" y="312" class="label">LATENCY</text>
  <g transform="translate(420, 336)">
    <text x="0"   y="0" class="ink2 stat-text">SubVault: <tspan class="cobalt stat-num">286 ms</tspan></text>
    <text x="160" y="0" class="ink3 stat-text">considered 107, selected 47</text>
  </g>
</svg>
